[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
buib-protocol = { workspace = true }
buibd = { workspace = true }
buibctl = { workspace = true }

[dependency-groups]
dev = [
    "pytest >= 8.0",
    "pytest-asyncio >= 0.24",
    "ruff >= 0.6",
    "mypy >= 1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:buibd.*", "error::DeprecationWarning:buibctl.*"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["buib_protocol", "buibd", "buibctl"]
mypy_path = [
    "packages/buib-protocol/src",
    "packages/buibd/src",
    "packages/buibctl/src",
]

[[tool.mypy.overrides]]
module = ["uinput.*", "bumble.*"]
ignore_missing_imports = true
