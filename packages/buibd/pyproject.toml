[project]
name = "buibd"
version = "0.1.0"
description = "Bluetooth HID to Linux uinput bridge: the daemon"
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.11"
dependencies = [
    "buib-protocol",
    "bumble >= 0.0.235",
    "python-uinput >= 1.0.1",
]

[project.scripts]
buibd = "buibd.cli:main"

[project.urls]
Homepage = "https://github.com/example/buib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buibd"]
