[project]
name = "buibctl"
version = "0.1.0"
description = "Bluetooth HID to Linux uinput bridge: the client"
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.11"
dependencies = ["buib-protocol"]

[project.scripts]
buibctl = "buibctl.cli:main"

[project.urls]
Homepage = "https://github.com/example/buib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buibctl"]
