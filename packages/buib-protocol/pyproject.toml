[project]
name = "buib-protocol"
version = "0.1.0"
description = "Wire protocol shared between the buibd daemon and the buibctl client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/example/buib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buib_protocol"]
